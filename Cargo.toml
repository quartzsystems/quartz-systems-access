[workspace]
resolver = "3"
members = ["qsaccess", "qsa-ui", "qsa-config", "qsa-msg", "qsa-glyph", "qsa-icons", "qsa-install", "qsa-net", "qap-client", "pwsub", "tn5250", "scs", "qsa-print", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/quartz-systems-access"

[workspace.dependencies]
fltk = { version = "1.5", features = ["static-msvcrt", "use-wayland"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
keyring = { version = "3.6", default-features = false }
directories = "6"
thiserror = "2"
windows-sys = "0.61"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
# Protocol-mandated password substitution, only inside pwsub.
des = "0.8"
sha1 = "0.10"
zeroize = "1"
getrandom = "0.4"

png = "0.17"
ico = "0.4"
zstd = "0.13"
tar = "0.4"
windows = "0.61"
printpdf = { version = "0.12.8", default-features = false, features = ["text_layout"] }

qsa-ui = { path = "qsa-ui" }
qsa-glyph = { path = "qsa-glyph" }
qsa-icons = { path = "qsa-icons" }
qsa-config = { path = "qsa-config" }
qsa-msg = { path = "qsa-msg" }
qsa-net = { path = "qsa-net" }
pwsub = { path = "pwsub" }
tn5250 = { path = "tn5250" }
scs = { path = "scs" }
qsa-print = { path = "qsa-print" }
qap-client = { path = "qap-client" }

# QAP from the QS/400 repository, pinned to one commit. docs/qap-protocol-spec.md
# is QS/400's docs/QAP.md at that commit and moves with it (ci/spec-mirror.sh).
# qapd, the server's connection engine, is for tests only.
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "58a7e6d3a95a498d50ce3ff40e4969f2351fc813", package = "ipc" }
qap-proto = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "58a7e6d3a95a498d50ce3ff40e4969f2351fc813", package = "qap-proto" }
qapd = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "58a7e6d3a95a498d50ce3ff40e4969f2351fc813", package = "qapd" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
