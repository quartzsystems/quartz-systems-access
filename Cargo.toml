[workspace]
resolver = "3"
members = ["qsaccess", "qsa-ui", "qsa-config", "qsa-msg", "qsa-glyph", "qsa-icons", "qsa-install", "qsa-net", "qap-client", "qsa-sql", "qsa-transfer", "tn5250", "scs", "qsa-print", "xtask"]

[workspace.package]
# Always VERSION's: change both with ci/version.sh prepare, which CI checks.
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/quartz-systems-access"

[workspace.dependencies]
fltk = { version = "1.5", features = ["static-msvcrt", "use-wayland"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
thiserror = "2"
windows-sys = "0.61"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.4"

png = "0.17"
ico = "0.4"
zstd = "0.13"
tar = "0.4"
windows = "0.61"
printpdf = { version = "0.12.8", default-features = false, features = ["text_layout"] }
# Data Transfer's spreadsheets: XLSX written, XLSX and ODS read, ODS zipped.
rust_xlsxwriter = { version = "0.102", default-features = false, features = ["constant_memory"] }
calamine = { version = "0.38", default-features = false }
zip = { version = "9.2", default-features = false, features = ["deflate"] }

qsa-ui = { path = "qsa-ui" }
qsa-glyph = { path = "qsa-glyph" }
qsa-icons = { path = "qsa-icons" }
qsa-config = { path = "qsa-config" }
qsa-msg = { path = "qsa-msg" }
qsa-net = { path = "qsa-net" }
tn5250 = { path = "tn5250" }
scs = { path = "scs" }
qsa-print = { path = "qsa-print" }
qap-client = { path = "qap-client" }
qsa-sql = { path = "qsa-sql" }
qsa-transfer = { path = "qsa-transfer" }

# QAP from the QS/400 repository, pinned to one commit. docs/qap-protocol-spec.md
# is QS/400's docs/QAP.md at that commit and moves with it (ci/spec-mirror.sh).
# qapd, the server's connection engine, is for tests only.
ipc = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "f6cb4aa2284e087791a631972980bb0aa06fb0c2", package = "ipc" }
qap-proto = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "f6cb4aa2284e087791a631972980bb0aa06fb0c2", package = "qap-proto" }
qapd = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "f6cb4aa2284e087791a631972980bb0aa06fb0c2", package = "qapd" }
# QAP version 1 only, for the fallback tests: qapd as it was before version 2,
# and the qap-proto its Host is written in. They meet the current crates only
# over loopback.
qapd_v1 = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "58a7e6d3a95a498d50ce3ff40e4969f2351fc813", package = "qapd" }
qap_proto_v1 = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "58a7e6d3a95a498d50ce3ff40e4969f2351fc813", package = "qap-proto" }
# QAP version 2 only, for the same: qapd and qap-proto as they were before
# version 3.
qapd_v2 = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "8306ec412b4d8634bda5d3f0201bf0d465a680c3", package = "qapd" }
qap_proto_v2 = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "8306ec412b4d8634bda5d3f0201bf0d465a680c3", package = "qap-proto" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
