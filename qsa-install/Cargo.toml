[package]
name = "qsa-install"
description = "Installer, uninstaller and repairer for QS/400 Access for Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fltk.workspace = true
qsa-ui.workspace = true
qsa-msg.workspace = true
qsa-config.workspace = true
qsaccess = { path = "../qsaccess" }
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
directories.workspace = true
sha2.workspace = true
zstd.workspace = true
tar.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
windows = { workspace = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
qsa-glyph.workspace = true
qsa-icons.workspace = true

[lints]
workspace = true

[[test]]
name = "screenshots"
harness = false
