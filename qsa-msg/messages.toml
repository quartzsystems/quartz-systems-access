# QS/400 Access for Desktop: client-side message catalogue.
#
# Each message has:
#   severity  0-99. 0 information, 10 warning, 20 and up error.
#   text      first-level text: one line.
#   cause     second-level text, Cause section.
#   recovery  second-level text, Recovery section.
#
# &1 to &9 are substitution variables, filled in order from the arguments
# given when the message is sent. They may appear in any of the three texts.

[QAD0001]
severity = 10
text = "Function not yet available."
cause = "The function you selected is not part of this release of QS/400 Access for Desktop."
recovery = "Use another function. The function will be enabled in a later release."

[QAD0010]
severity = 0
text = "System &1 added."
cause = "A system configuration named &1 was created and saved."
recovery = "None needed."

[QAD0011]
severity = 0
text = "System &1 changed."
cause = "The system configuration named &1 was updated and saved."
recovery = "None needed."

[QAD0012]
severity = 0
text = "System &1 deleted."
cause = "The system configuration named &1 was removed, together with any password saved for it in the credential store."
recovery = "None needed. To use the system again, add a new system configuration for it."

[QAD0020]
severity = 0
text = "&1 systems imported."
cause = "&1 system configurations were read from the import file and added to, or replaced in, the list of systems."
recovery = "None needed. Passwords are never part of an import file; enter them when you first connect."

[QAD0021]
severity = 0
text = "&1 systems exported to &2."
cause = "&1 system configurations were written to the file &2."
recovery = "None needed. The file contains no passwords."

[QAD0030]
severity = 30
text = "Settings file &1 could not be read."
cause = "The file &1 could not be opened, or it holds a value that is not valid. The reason given was: &2"
recovery = "Correct the file and start QS/400 Access for Desktop again, or carry on with default values. If you carry on, the unreadable file is kept as &1.unreadable the first time the program saves."

[QAD0040]
severity = 10
text = "Credential store not available; you will be prompted each time."
cause = "No credential store could be reached. On Windows this is the Windows Credential Manager; on Linux it is a Secret Service provider on the session bus. Passwords are never saved anywhere else."
recovery = "On Linux, start a Secret Service provider for your session and start QS/400 Access for Desktop again. Until then, enter your password whenever you are prompted."

# 5250 display sessions.

[QAD1001]
severity = 0
text = "Connecting to &1 port &2."
cause = "A 5250 display session is opening a connection to system &1 on port &2."
recovery = "None needed. If the connection does not complete within 15 seconds it is ended and another message says why."

[QAD1002]
severity = 30
text = "Connection to &1 refused."
cause = "System &1 answered, but nothing accepted the connection on the port used. The Telnet server may not be started, or the port in the system configuration may be wrong, or TLS may be selected for a system with no TLS listener."
recovery = "Check that the Telnet server is started on &1, and check the Telnet ports on the Ports tab of the system's properties and the TLS setting on its Security tab. Then select Reconnect."

[QAD1003]
severity = 30
text = "Host &1 not found."
cause = "The name &1 could not be turned into an address. The name may be misspelt, or the name server may not know it."
recovery = "Correct the system name in System Configurations, or give a fixed IP address on the Connection tab. Then start the session again."

[QAD1004]
severity = 30
text = "Connection to &1 timed out."
cause = "No answer came from system &1 within 15 seconds. The system may be down, or a firewall may be dropping the connection."
recovery = "Check that &1 is running and can be reached from this computer, then select Reconnect."

[QAD1005]
severity = 20
text = "Session to &1 ended by the system."
cause = "System &1 closed the connection. This happens when the job ends after sign-off, when the device is varied off, or when the connection is lost."
recovery = "Select Reconnect to start a new session. The last screen stays visible until then."

[QAD1006]
severity = 0
text = "Session to &1 disconnected."
cause = "The session to system &1 was disconnected at your request. What the job does now depends on the device recovery action of the system: it may end, or wait for you to sign on again."
recovery = "Select Reconnect to start a new session. The last screen stays visible until then."

[QAD1010]
severity = 30
text = "TLS handshake with &1 failed: &2."
cause = "A TLS session could not be set up with system &1. The reason given was: &2"
recovery = "Check that the port on the Ports tab is the system's TLS Telnet port and that the system's TLS configuration is complete. If the system offers no TLS, clear TLS on the Security tab."

[QAD1011]
severity = 30
text = "Certificate for &1 is not trusted."
cause = "System &1 presented a certificate that does not chain to a certificate authority this computer trusts, or that is not valid for the name &1. The reason given was: &2"
recovery = "Compare the certificate's SHA-256 fingerprint with the one shown on the system itself. If they match and you trust the system, select Trust for this system; the certificate is added to this system's CA list. Otherwise do not connect."

[QAD1012]
severity = 0
text = "Certificate for &1 added to trusted list."
cause = "The certificate presented by system &1 was added to the CA certificates of this system's configuration. Connections to &1 that present it are trusted from now on. Other systems are not affected."
recovery = "None needed. To withdraw the trust, remove the certificate from the Security tab of the system's properties."

[QAD1020]
severity = 30
text = "Device name &1 is in use."
cause = "The system could not give this session the display device &1: the device is in use by another session or is not available (start-up response code &2)."
recovery = "Select Retry without device name to let the system choose a device, or change the device name and start the session again."

[QAD1021]
severity = 30
text = "Device name &1 is not valid."
cause = "The system refused display device name &1 for this session (start-up response code &2: &3)."
recovery = "Select Retry without device name to let the system choose a device, or give a device name of 1 to 10 letters, digits, #, $ or @, starting with a letter."

[QAD1022]
severity = 10
text = "System does not support TN5250E; using basic 5250."
cause = "The system did not take up the enhanced Telnet options (NEW-ENVIRON). The session continues as a basic 5250 display: the device name and the code page settings are not passed to the system."
recovery = "None needed for a working session. To choose the device name, enable the enhanced Telnet support on the system."

[QAD1030]
severity = 30
text = "Protocol error from &1: &2."
cause = "System &1 sent data that does not follow the 5250 protocol. The reason was: &2. A negative response was sent where the protocol defines one, and the details were written to the log."
recovery = "If the screen looks wrong, press Enter or select Reconnect. Report the problem with the log file qsaccess.log; it names the bytes that were not valid."

[QAD1040]
severity = 0
text = "Screen printed to &1."
cause = "The screen was written as a PDF file to &1."
recovery = "None needed. Open the file to view or print it."

# Session, keyboard map and macro files; Session Manager.

[QAD2001]
severity = 30
text = "Session file &1 could not be read: &2."
cause = "The file &1 could not be opened, or it is not a valid session, keyboard map or macro file. The reason given was: &2"
recovery = "Correct the file, or open another one. These files are TOML text whose first table is [qsaccess], giving the kind of file and its format version."

[QAD2002]
severity = 30
text = "Session file &1 was made by a newer version (&2)."
cause = "The file &1 is format version &2, which is newer than this release of QS/400 Access for Desktop can read. The file was not opened and has not been changed."
recovery = "Open the file with the release that made it, or install a newer release of QS/400 Access for Desktop."

[QAD2003]
severity = 20
text = "System &1 is not configured."
cause = "The session file names system &1, but no system configuration of that name exists on this computer. The file holds the host, Telnet port and TLS setting to use as a starting point."
recovery = "Select Create system from session file to add a system configuration from those values, or add the system in System Configurations and open the session file again."

[QAD2004]
severity = 0
text = "Session saved to &1."
cause = "The session's settings were written to the session file &1. The file holds no password and no certificate trust."
recovery = "None needed. Open the file, or double-click it, to start the session again."

[QAD2010]
severity = 0
text = "Keyboard map loaded from &1."
cause = "The keyboard map in the file &1 was copied. Later changes to the file do not affect the copy."
recovery = "None needed. Save the session to keep the map with it."

[QAD2011]
severity = 0
text = "Keyboard maps migrated for &1 systems."
cause = "Keyboard maps kept per system by an earlier release were moved into session files for &1 systems and removed from settings.toml. The details were written to the log."
recovery = "None needed. Each session now carries its own keyboard map; use Load keyboard map to copy one between sessions."

[QAD2020]
severity = 30
text = "Macro &1 stopped at step &2: &3."
cause = "Macro &1 could not carry out step &2 and was stopped. The reason was: &3. The steps after it were not run."
recovery = "Check that the session shows the screen the macro expects at step &2, then run the macro again. To change the step, open the macro in the Macro editor."

[QAD2021]
severity = 0
text = "Macro &1 recorded with &2 steps."
cause = "Recording ended and macro &1 was saved with &2 steps. Text typed into fields that are not displayed, such as passwords, was not recorded; a step that asks for the value when the macro runs takes its place."
recovery = "None needed. Run the macro from the session's Macro menu, or open it in the Macro editor to change it."

[QAD2030]
severity = 0
text = "Folder &1 added to Session Manager."
cause = "Session Manager now lists the session files in the folder &1, together with those in the other folders it shows."
recovery = "None needed. To stop listing the folder, select it and select Remove folder. The files in it are not affected."

# Installer.

[QAD2101]
severity = 0
text = "QS/400 Access for Desktop installed in &1."
cause = "The program files were installed in &1, and the shortcuts and file types you selected were registered. Every item created is listed in install-manifest.toml in that folder."
recovery = "None needed. Start QS/400 Access for Desktop from the applications menu, or double-click a session file."

[QAD2102]
severity = 0
text = "Upgrade from &1 to &2 complete."
cause = "The program files of release &1 were replaced with those of release &2. Settings, system configurations, session files and saved passwords were kept."
recovery = "None needed."

[QAD2103]
severity = 40
text = "Installer payload is damaged; download it again."
cause = "The program files packed inside the installer do not match the checksum recorded when it was built. The file was probably changed or cut short while it was copied or downloaded. Nothing was installed or changed."
recovery = "Download the installer again, and check that its size matches the size published with it."

[QAD2104]
severity = 30
text = "Administrator rights are needed to install for all users."
cause = "Installing for all users writes to a folder and settings that only an administrator can change. The rights were not granted, so nothing was installed for all users."
recovery = "Run the installer again and allow the change when asked, or select Just me to install for your own account. On Linux, run the installer as root to install for all users."

[QAD2105]
severity = 0
text = "QS/400 Access for Desktop removed."
cause = "Every file, folder, shortcut and file type listed in the install manifest was removed. Settings, system configurations and saved passwords were kept unless you asked for your settings to be removed. The Sessions folder is never removed."
recovery = "None needed."

[QAD2106]
severity = 0
text = "Repair complete."
cause = "The program files, shortcuts and file types recorded in the install manifest were written again. Settings, system configurations, session files and saved passwords were not changed."
recovery = "None needed."

[QAD3001]
severity = 0
text = "Printer session &1 connected to &2."
cause = "The printer session with device &1 is connected to system &2. The system's writer for the device can now send it spooled files."
recovery = "None needed. If the writer is not started, start it on the system for device &1."

[QAD3002]
severity = 30
text = "Printer device name is required."
cause = "A printer session needs the name of a printer device on the system, and none was given."
recovery = "Type a device name of 1 to 10 letters, digits, #, $, @ or _, starting with a letter, #, $ or @, and start the session again."

[QAD3003]
severity = 30
text = "Device &1 is not a printer device on &2."
cause = "System &2 refused device &1 for a printer session (start-up response code &3: &4). The device may be a display device, or its description may not allow this kind of session."
recovery = "Give the name of a printer device on &2, or a new name so that the system can create one, and start the session again."

[QAD3004]
severity = 30
text = "Message queue &1 in library &2 not found on &3."
cause = "System &3 could not create or change the printer device because message queue &1 in library &2 does not exist (start-up response code &4)."
recovery = "Create the message queue on &3, or change the message queue in the session's settings (leave it empty for QSYSOPR in QSYS), and start the session again."

[QAD3010]
severity = 0
text = "Output for &1 saved to &2 (&3 pages)."
cause = "A print job received by printer session &1 was written to &2 as a PDF of &3 pages."
recovery = "None needed. Double-click the job in the Received output list to open it."

[QAD3011]
severity = 0
text = "Output for &1 sent to printer &2 (&3 pages)."
cause = "A print job received by printer session &1 was sent to printer &2, &3 pages."
recovery = "None needed. If nothing prints, look at the printer's queue in the operating system."

[QAD3012]
severity = 10
text = "System printing is not available: &1."
cause = "Printer sessions cannot print on this computer's printers: &1. Received output is still saved as PDF files."
recovery = "On Linux, install the CUPS client commands (lp and lpstat). On Windows, add a printer in Settings. Then set the session's output to the system printer again."

[QAD3013]
severity = 30
text = "Printer &1 reported an error: &2."
cause = "Sending a print job to printer &1 failed: &2. The job is kept, and the system was told that the printer is not ready."
recovery = "Correct the problem with printer &1, then select Print again for the job in the Received output list. Reply to the printer message on the system to let the writer go on."

[QAD3014]
severity = 30
text = "Output folder &1 cannot be written."
cause = "The printer session could not create or write files in folder &1. The received job is kept in a temporary file, and the system was told that the printer is not ready."
recovery = "Choose another output folder in the session's settings, or make &1 writable, then reply to the printer message on the system to let the writer go on."

[QAD3020]
severity = 10
text = "Transformed print data received and discarded."
cause = "The system sent printer data that had already been converted for a particular printer (host print transform). This client prints SCS data only, and never asks for transformed data, so the job was not printed."
recovery = "Change the printer device on the system so that host print transform is off, then print the spooled file again."

[QAD3021]
severity = 0
text = "Print job closed after idle timeout."
cause = "The system does not mark where print jobs end, so the printer session ended the job after 10 seconds without data."
recovery = "None needed. If one spooled file was split into two outputs, print it again; the system may be slow to send it."

[QAD3022]
severity = 30
text = "Print record from &1 rejected: &2."
cause = "System &1 sent a print record that this printer session cannot handle: &2. The session answered with the negative response for an invalid print command, so the system's writer is told the data was not printed. Nothing was saved or printed for the record."
recovery = "Look at the writer for the device and its message queue on system &1. If the system's writer keeps sending such records, report the problem to the system's administrator with the session's log file."

[QAD3023]
severity = 20
text = "Output for &1 is incomplete: the job ended before the system finished sending it."
cause = "The connection for printer session &1 ended, or the program stopped, while a print job was arriving, before the system marked the end of the job. What arrived was saved or printed as it stands; the rest of the job is missing."
recovery = "Check the output. If pages are missing, print the spooled file again on the system once the session is connected; the system's writer may also send it again by itself."

[QAD3030]
severity = 10
text = "Reconnecting printer session &1 in &2 seconds."
cause = "The connection for printer session &1 was lost. The session tries again by itself, waiting longer each time, up to 5 minutes."
recovery = "None needed. To stop trying, select Disconnect. Received output is never lost."
