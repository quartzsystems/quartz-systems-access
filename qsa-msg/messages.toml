# QS/400 Access for Desktop: client-side message catalogue.
#
# Each message has:
#   severity  0-99. 0 information, 10 warning, 20 and up error.
#   text      first-level text: one line.
#   cause     second-level text, Cause section.
#   recovery  second-level text, Recovery section.
#
# &1 to &9 are substitution variables, filled in order from the arguments
# given when the message is sent. They may appear in any of the three texts.

[QAD0001]
severity = 10
text = "Function not yet available."
cause = "The function you selected is not part of this release of QS/400 Access for Desktop."
recovery = "Use another function. The function will be enabled in a later release."

[QAD0010]
severity = 0
text = "System &1 added."
cause = "A system configuration named &1 was created and saved."
recovery = "None needed."

[QAD0011]
severity = 0
text = "System &1 changed."
cause = "The system configuration named &1 was updated and saved."
recovery = "None needed."

[QAD0012]
severity = 0
text = "System &1 deleted."
cause = "The system configuration named &1 was removed."
recovery = "None needed. To use the system again, add a new system configuration for it."

[QAD0020]
severity = 0
text = "&1 systems imported."
cause = "&1 system configurations were read from the import file and added to, or replaced in, the list of systems."
recovery = "None needed. Passwords are never part of an import file; enter them when you first connect."

[QAD0021]
severity = 0
text = "&1 systems exported to &2."
cause = "&1 system configurations were written to the file &2."
recovery = "None needed. The file contains no passwords."

[QAD0030]
severity = 30
text = "Settings file &1 could not be read."
cause = "The file &1 could not be opened, or it holds a value that is not valid. The reason given was: &2"
recovery = "Correct the file and start QS/400 Access for Desktop again, or carry on with default values. If you carry on, the unreadable file is kept as &1.unreadable the first time the program saves."

[QAD0040]
severity = 0
text = "Certificate &1 imported for &2 systems."
cause = "Certificate &1 was added to the trusted CA certificates of &2 system configurations. Connections to those systems trust it from now on: as a certificate authority for the certificates they present, or as the certificate a system presents itself. Other systems are not affected."
recovery = "None needed. Certificate Management lists the certificate with the systems that trust it. To withdraw the trust, select the certificate there and select Trusted for... or Remove."

[QAD0041]
severity = 0
text = "Certificate &1 removed from &2 systems."
cause = "Certificate &1 was taken out of the trusted CA certificates of &2 system configurations. A connection to one of those systems that needs the certificate is refused as not trusted from now on. Connections that are open stay open."
recovery = "None needed. To trust the certificate again, import it in Certificate Management, or select Trust for this system when a connection presents it."

[QAD0042]
severity = 0
text = "Certificate &1 exported to &2."
cause = "Certificate &1 was written to the file &2 as PEM text. The file holds the certificate only; a certificate has no private key in it."
recovery = "None needed. The file can be imported on another computer in Certificate Management, or added on the Security tab of a system's properties."

[QAD0043]
severity = 30
text = "File &1 does not contain a certificate."
cause = "The file &1 was read, but no X.509 certificate was found in it. Import takes a PEM file with one or more CERTIFICATE blocks, or a DER file holding one certificate. A private key, a certificate request and a key store are not certificates."
recovery = "Choose the file that holds the certificate of the system or of its certificate authority. The system's administrator can export it from the system's certificate manager. Then select Import... again."

[QAD0044]
severity = 10
text = "Certificate &1 has expired."
cause = "The Valid to time of certificate &1, &2, has passed. A system that still presents an expired certificate, or one issued by an expired certificate authority, should be given a new one."
recovery = "Ask the system's administrator for the current certificate and import that instead. Select Import to trust this certificate all the same, or Skip to leave it out."

[QAD0050]
severity = 30
text = "Help topic &1 not found."
cause = "Help was asked for a topic named &1, and Help has no topic of that name. Every topic is part of the program, and each link in Help and each Help button is checked when the program is built, so this means the program was not built from a complete set of topics."
recovery = "Select Home in the Help window, and find the topic in Contents or with Search. Install QS/400 Access for Desktop again if the message returns, and report it with the topic's name."

[QAD1001]
severity = 0
text = "Connecting to &1 port &2."
cause = "A 5250 display session is opening a connection to system &1 on port &2."
recovery = "None needed. If the connection does not complete within 15 seconds it is ended and another message says why."

[QAD1002]
severity = 30
text = "Connection to &1 refused."
cause = "System &1 answered, but nothing accepted the connection on the port used. The Telnet server may not be started, or the port in the system configuration may be wrong, or TLS may be selected for a system with no TLS listener."
recovery = "Check that the Telnet server is started on &1, and check the Telnet ports on the Ports tab of the system's properties and Use TLS for all connections on its General tab. Then select Reconnect."

[QAD1003]
severity = 30
text = "Host &1 not found."
cause = "The name &1 could not be turned into an address. The name may be misspelt, or the name server may not know it."
recovery = "Correct the system name in System Configurations, or give a fixed IP address on the Connection tab. Then start the session again."

[QAD1004]
severity = 30
text = "Connection to &1 timed out."
cause = "No answer came from system &1 within 15 seconds. The system may be down, or a firewall may be dropping the connection."
recovery = "Check that &1 is running and can be reached from this computer, then select Reconnect."

[QAD1005]
severity = 20
text = "Session to &1 ended by the system."
cause = "System &1 closed the connection. This happens when the job ends after sign-off, when the device is varied off, or when the connection is lost."
recovery = "Select Reconnect to start a new session. The last screen stays visible until then."

[QAD1006]
severity = 0
text = "Session to &1 disconnected."
cause = "The session to system &1 was disconnected at your request. What the job does now depends on the device recovery action of the system: it may end, or wait for you to sign on again."
recovery = "Select Reconnect to start a new session. The last screen stays visible until then."

[QAD1010]
severity = 30
text = "TLS handshake with &1 failed: &2."
cause = "A TLS session could not be set up with system &1. The reason given was: &2"
recovery = "Check that the port on the Ports tab is the system's TLS Telnet port and that the system's TLS configuration is complete. If the system offers no TLS, clear Use TLS for all connections on the General tab of the system's properties."

[QAD1011]
severity = 30
text = "Certificate for &1 is not trusted."
cause = "System &1 presented a certificate that does not chain to a certificate authority this computer trusts, or that is not valid for the name &1. The reason given was: &2"
recovery = "Compare the certificate's SHA-256 fingerprint with the one shown on the system itself. If they match and you trust the system, select Trust for this system; the certificate is added to this system's CA list. Otherwise do not connect."

[QAD1012]
severity = 0
text = "Certificate for &1 added to trusted list."
cause = "The certificate presented by system &1 was added to the CA certificates of this system's configuration. Connections to &1 that present it are trusted from now on. Other systems are not affected."
recovery = "None needed. To withdraw the trust, remove the certificate in Certificate Management, or from the Security tab of the system's properties."

[QAD1020]
severity = 30
text = "Device name &1 is in use."
cause = "The system could not give this session the display device &1: the device is in use by another session or is not available (start-up response code &2)."
recovery = "Select Retry without device name to let the system choose a device, or change the device name and start the session again."

[QAD1021]
severity = 30
text = "Device name &1 is not valid."
cause = "The system refused display device name &1 for this session (start-up response code &2: &3)."
recovery = "Select Retry without device name to let the system choose a device, or give a device name of 1 to 10 letters, digits, #, $ or @, starting with a letter."

[QAD1022]
severity = 10
text = "System does not support TN5250E; using basic 5250."
cause = "The system did not take up the enhanced Telnet options (NEW-ENVIRON). The session continues as a basic 5250 display: the device name and the code page settings are not passed to the system."
recovery = "None needed for a working session. To choose the device name, enable the enhanced Telnet support on the system."

[QAD1030]
severity = 30
text = "Protocol error from &1: &2."
cause = "System &1 sent data that does not follow the 5250 protocol. The reason was: &2. A negative response was sent where the protocol defines one, and the details were written to the log."
recovery = "If the screen looks wrong, press Enter or select Reconnect. Report the problem with the log file qsaccess.log; it names the bytes that were not valid."

[QAD1040]
severity = 0
text = "Screen printed to &1."
cause = "The screen was written as a PDF file to &1."
recovery = "None needed. Open the file to view or print it."

# Session, keyboard map and macro files; Session Manager.

[QAD2001]
severity = 30
text = "Session file &1 could not be read: &2."
cause = "The file &1 could not be opened, or it is not a valid session, keyboard map or macro file. The reason given was: &2"
recovery = "Correct the file, or open another one. These files are TOML text whose first table is [qsaccess], giving the kind of file and its format version."

[QAD2002]
severity = 30
text = "Session file &1 was made by a newer version (&2)."
cause = "The file &1 is format version &2, which is newer than this release of QS/400 Access for Desktop can read. The file was not opened and has not been changed."
recovery = "Open the file with the release that made it, or install a newer release of QS/400 Access for Desktop."

[QAD2003]
severity = 20
text = "System &1 is not configured."
cause = "The session file names system &1, but no system configuration of that name exists on this computer. The file holds the host, Telnet port and TLS setting to use as a starting point."
recovery = "Select Create system from session file to add a system configuration from those values, or add the system in System Configurations and open the session file again."

[QAD2004]
severity = 0
text = "Session saved to &1."
cause = "The session's settings were written to the session file &1. The file holds no password and no certificate trust."
recovery = "None needed. Open the file, or double-click it, to start the session again."

[QAD2010]
severity = 0
text = "Keyboard map loaded from &1."
cause = "The keyboard map in the file &1 was copied. Later changes to the file do not affect the copy."
recovery = "None needed. Save the session to keep the map with it."

[QAD2011]
severity = 0
text = "Keyboard maps migrated for &1 systems."
cause = "Keyboard maps kept per system by an earlier release were moved into session files for &1 systems and removed from settings.toml. The details were written to the log."
recovery = "None needed. Each session now carries its own keyboard map; use Load keyboard map to copy one between sessions."

[QAD2012]
severity = 0
text = "Files moved to &1."
cause = "Everything QS/400 Access for Desktop saves in your Documents folder is now kept in one folder, &1: session files in Sessions, printer output in Printer Output and printed screens in Screens. Earlier releases used the folders Quartz Access and QS400 Access. What they held was moved to &1, and Recent Sessions and Session Manager's folders follow it."
recovery = "None needed. A file whose name was already taken in &1 was not moved and not changed: it is still in its earlier folder, and the log names it. Move or rename it yourself if you want it with the rest."

[QAD2020]
severity = 30
text = "Macro &1 stopped at step &2: &3."
cause = "Macro &1 could not carry out step &2 and was stopped. The reason was: &3. The steps after it were not run."
recovery = "Check that the session shows the screen the macro expects at step &2, then run the macro again. To change the step, open the macro in the Macro editor."

[QAD2021]
severity = 0
text = "Macro &1 recorded with &2 steps."
cause = "Recording ended and macro &1 was saved with &2 steps. Text typed into fields that are not displayed, such as passwords, was not recorded; a step that asks for the value when the macro runs takes its place."
recovery = "None needed. Run the macro from the session's Macro menu, or open it in the Macro editor to change it."

[QAD2030]
severity = 0
text = "Folder &1 added to Session Manager."
cause = "Session Manager now lists the session files in the folder &1, together with those in the other folders it shows."
recovery = "None needed. To stop listing the folder, select it and select Remove folder. The files in it are not affected."

# Installer.

[QAD2101]
severity = 0
text = "QS/400 Access for Desktop installed in &1."
cause = "The program files were installed in &1, and the shortcuts and file types you selected were registered. Every item created is listed in install-manifest.toml in that folder."
recovery = "None needed. Start QS/400 Access for Desktop from the applications menu, or double-click a session file."

[QAD2102]
severity = 0
text = "Upgrade from &1 to &2 complete."
cause = "The program files of release &1 were replaced with those of release &2. Settings, system configurations and session files were kept."
recovery = "None needed."

[QAD2103]
severity = 40
text = "Installer payload is damaged; download it again."
cause = "The program files packed inside the installer do not match the checksum recorded when it was built. The file was probably changed or cut short while it was copied or downloaded. Nothing was installed or changed."
recovery = "Download the installer again, and check that its size matches the size published with it."

[QAD2104]
severity = 30
text = "Administrator rights are needed to install for all users."
cause = "Installing for all users writes to a folder and settings that only an administrator can change. The rights were not granted, so nothing was installed for all users."
recovery = "Run the installer again and allow the change when asked, or select Just me to install for your own account. On Linux, run the installer as root to install for all users."

[QAD2105]
severity = 0
text = "QS/400 Access for Desktop removed."
cause = "Every file, folder, shortcut and file type listed in the install manifest was removed. Settings and system configurations were kept unless you asked for your settings to be removed. The Sessions folder is never removed."
recovery = "None needed."

[QAD2106]
severity = 0
text = "Repair complete."
cause = "The program files, shortcuts and file types recorded in the install manifest were written again. Settings, system configurations and session files were not changed."
recovery = "None needed."

[QAD3001]
severity = 0
text = "Printer session &1 connected to &2."
cause = "The printer session with device &1 is connected to system &2. The system's writer for the device can now send it spooled files."
recovery = "None needed. If the writer is not started, start it on the system for device &1."

[QAD3002]
severity = 30
text = "Printer device name is required."
cause = "A printer session needs the name of a printer device on the system, and none was given."
recovery = "Type a device name of 1 to 10 letters, digits, #, $, @ or _, starting with a letter, #, $ or @, and start the session again."

[QAD3003]
severity = 30
text = "Device &1 is not a printer device on &2."
cause = "System &2 refused device &1 for a printer session (start-up response code &3: &4). The device may be a display device, or its description may not allow this kind of session."
recovery = "Give the name of a printer device on &2, or a new name so that the system can create one, and start the session again."

[QAD3004]
severity = 30
text = "Message queue &1 in library &2 not found on &3."
cause = "System &3 could not create or change the printer device because message queue &1 in library &2 does not exist (start-up response code &4)."
recovery = "Create the message queue on &3, or change the message queue in the session's settings (leave it empty for QSYSOPR in QSYS), and start the session again."

[QAD3010]
severity = 0
text = "Output for &1 saved to &2 (&3 pages)."
cause = "A print job received by printer session &1 was written to &2 as a PDF of &3 pages."
recovery = "None needed. Double-click the job in the Received output list to open it."

[QAD3011]
severity = 0
text = "Output for &1 sent to printer &2 (&3 pages)."
cause = "A print job received by printer session &1 was sent to printer &2, &3 pages."
recovery = "None needed. If nothing prints, look at the printer's queue in the operating system."

[QAD3012]
severity = 10
text = "System printing is not available: &1."
cause = "Printer sessions cannot print on this computer's printers: &1. Received output is still saved as PDF files."
recovery = "On Linux, install the CUPS client commands (lp and lpstat). On Windows, add a printer in Settings. Then set the session's output to the system printer again."

[QAD3013]
severity = 30
text = "Printer &1 reported an error: &2."
cause = "Sending a print job to printer &1 failed: &2. The job is kept, and the system was told that the printer is not ready."
recovery = "Correct the problem with printer &1, then select Print again for the job in the Received output list. Reply to the printer message on the system to let the writer go on."

[QAD3014]
severity = 30
text = "Output folder &1 cannot be written."
cause = "The printer session could not create or write files in folder &1. The received job is kept in a temporary file, and the system was told that the printer is not ready."
recovery = "Choose another output folder in the session's settings, or make &1 writable, then reply to the printer message on the system to let the writer go on."

[QAD3020]
severity = 10
text = "Transformed print data received and discarded."
cause = "The system sent printer data that had already been converted for a particular printer (host print transform). This client prints SCS data only, and never asks for transformed data, so the job was not printed."
recovery = "Change the printer device on the system so that host print transform is off, then print the spooled file again."

[QAD3021]
severity = 0
text = "Print job closed after idle timeout."
cause = "The system does not mark where print jobs end, so the printer session ended the job after 10 seconds without data."
recovery = "None needed. If one spooled file was split into two outputs, print it again; the system may be slow to send it."

[QAD3022]
severity = 30
text = "Print record from &1 rejected: &2."
cause = "System &1 sent a print record that this printer session cannot handle: &2. The session answered with the negative response for an invalid print command, so the system's writer is told the data was not printed. Nothing was saved or printed for the record."
recovery = "Look at the writer for the device and its message queue on system &1. If the system's writer keeps sending such records, report the problem to the system's administrator with the session's log file."

[QAD3023]
severity = 20
text = "Output for &1 is incomplete: the job ended before the system finished sending it."
cause = "The connection for printer session &1 ended, or the program stopped, while a print job was arriving, before the system marked the end of the job. What arrived was saved or printed as it stands; the rest of the job is missing."
recovery = "Check the output. If pages are missing, print the spooled file again on the system once the session is connected; the system's writer may also send it again by itself."

[QAD3030]
severity = 10
text = "Reconnecting printer session &1 in &2 seconds."
cause = "The connection for printer session &1 was lost. The session tries again by itself, waiting longer each time, up to 5 minutes."
recovery = "None needed. To stop trying, select Disconnect. Received output is never lost."

# Sign-on and connection verification (QAP). QAD4001 to QAD4012 belonged to
# a retired design; their numbers stay unused.

[QAD4020]
severity = 0
text = "Sign-on to &1 as &2 succeeded."
cause = "System &1 accepted user &2 and the password."
recovery = "None needed."

[QAD4021]
severity = 30
text = "Sign-on to &1 failed: &2."
cause = "System &1 did not accept the sign-on. The reason is &2, as the system gave it; a system message ID in it is the system's own."
recovery = "Check the user ID and password and try again. If the profile is disabled, or sign-on attempts were exceeded, ask the system's security officer to enable it."

[QAD4022]
severity = 20
text = "Password for &1 on &2 has expired."
cause = "The password of user &1 on system &2 is correct but has expired. The system requires a new one before it allows a sign-on."
recovery = "Change the password in the Change Password dialog. The new password must meet the system's password rules, which the system reports if it is refused."

[QAD4023]
severity = 0
text = "Password changed for &1 on &2."
cause = "System &2 accepted the new password for user &1."
recovery = "None needed. Use the new password from now on, including at the 5250 sign-on display."

[QAD4024]
severity = 20
text = "Session on &1 ended by an operator."
cause = "An operator on system &1 ended this program's QAP session, for example by ending its connection job. The system's message, shown with this one, says more."
recovery = "Sign on again. If the session is ended again, ask the system operator why."

[QAD4025]
severity = 20
text = "QAP server on &1 is ending."
cause = "The QAP server on system &1 is ending, for example because ENDTCPSVR SERVER(*QAP) was run or its subsystem ended, and closed the connection. Every QAP session on the system ended with it. The system's message, shown with this one, says more."
recovery = "Select Reconnect once the server is started again (STRTCPSVR SERVER(*QAP)), then sign on."

[QAD4026]
severity = 20
text = "Session on &1 expired; sign on again."
cause = "The QAP session on system &1 could not be resumed: it had no connection for longer than the system's idle timeout (CHGQAPA IDLETIMO), or the system ended it."
recovery = "Sign on again."

[QAD4027]
severity = 30
text = "New password and confirmation are not the same."
cause = "The new password and the confirmation of it were typed differently. Nothing was sent to the system."
recovery = "Type the new password again in both fields."

[QAD4028]
severity = 0
text = "Signed off from &1."
cause = "The QAP session on system &1 ended at this program's request."
recovery = "None needed."

[QAD4031]
severity = 10
text = "Password for &1 on &2 expires in &3 days."
cause = "The password of user profile &1 on system &2 expires in &3 days, within the system's password expiration warning period (system value QPWDEXPWRN). It is counted on the system's clock from the password's last change and its expiration interval. This warning is shown once per session."
recovery = "Select Change Password... to change it now, or change it later with Actions > Change Password... before it expires. Once it has expired, sign-on asks for a new one."

[QAD4040]
severity = 20
text = "Automatic sign-on to &1 was not accepted."
cause = "The 5250 session sent system &1 a one-time QAP ticket to sign on automatically, and the system showed its sign-on display instead. The system does not say why: automatic sign-on may not be allowed (system value QRMTSIGN), the connection may not be Telnet over TLS, or the ticket was used or had expired."
recovery = "Sign on at the sign-on display. To sign on automatically, ask for system value QRMTSIGN on &1 to be *VERIFY (or *SAMEPRF) and use TLS for the session (Session Properties, Use TLS); each connection asks for a new ticket."

[QAD4050]
severity = 0
text = "Connection to &1 verified."
cause = "Every required check of the connection to system &1 passed."
recovery = "None needed."

[QAD4051]
severity = 10
text = "Connection to &1 verified with warnings."
cause = "The required checks of the connection to system &1 passed, but the optional test sign-on failed."
recovery = "Look at the Detail column of the results for each check that did not pass. The system can be used, but some functions may not work."

[QAD4052]
severity = 30
text = "Connection verification for &1 failed."
cause = "At least one required check of the connection to system &1 failed."
recovery = "Look at the Detail column of the failed checks. Check the system's name or address, that its servers are started, and that the ports are open between this computer and the system."

[QAD4053]
severity = 30
text = "QAP server on &1 port &2 cannot be reached: &3."
cause = "A TCP connection to port &2 on system &1 could not be made: &3. The QAP server may not be started, or may be started on another port."
recovery = "Start the server on the system with STRTCPSVR SERVER(*QAP). The server refuses to start until a certificate is assigned to application ID QS400_ACCESS_SERVER in the system's certificate manager. Check that the QAP port on the Ports tab is the server's port (2320 unless changed with CHGQAPA), and that no firewall blocks it."

[QAD4054]
severity = 30
text = "TLS handshake with the QAP server on &1 failed: &2."
cause = "The QAP server on system &1 accepted the connection, but TLS could not be set up: &2."
recovery = "The QAP server accepts TLS 1.3 only, with the certificate assigned to application ID QS400_ACCESS_SERVER. Check that the QAP port on the Ports tab is the QAP server's and not another service's, and that nothing between this computer and the system intercepts TLS."

[QAD4055]
severity = 30
text = "QAP server on &1 supports none of protocol versions &2 to &3."
cause = "This program speaks QAP versions &2 to &3, and the QAP server on system &1 accepts none of them. The connection was closed."
recovery = "Install a release of this program that supports the system's QAP version, or ask for the system to be upgraded."

[QAD4060]
severity = 30
text = "Server &1 on &2 returned an unexpected reply: &3."
cause = "The &1 server on system &2 sent something this program cannot read: &3. The connection was closed."
recovery = "Check that the QAP port on the Ports tab is the system's QAP port. If it is, keep the program's log and report the problem."

[QAD5001]
severity = 20
text = "&1 needs QAP version &2; system &3 has version &4."
cause = "&1 uses a QAP operation that QAP version &2 introduced. The QAP server on system &3 speaks version &4, so this program does not offer &1 for that system; nothing was sent to it."
recovery = "Ask for system &3 to be upgraded to a QS/400 release whose QAP server speaks version &2 or later. Everything else works as before."

[QAD5010]
severity = 0
text = "Command &1 completed."
cause = "The system ran command &1 and it ended normally. Its messages are listed in Run Command's results, as the system sent them."
recovery = "None needed."

[QAD5011]
severity = 30
text = "Command &1 ended with an error."
cause = "Command &1 ended with an escape message, the last of its messages in Run Command's results. A command that can run only interactively ends this way too: QAP runs commands in a batch connection job."
recovery = "Select the escape message's ID to see its second-level text, correct the command and run it again. Run a command that can run only interactively from a 5250 display session."

[QAD5012]
severity = 10
text = "Command &1 was cancelled."
cause = "Cancel was selected while command &1 ran, and the system ended it. A command the system carries out in one piece finishes before it ends, so what it did may be done."
recovery = "Check whether the command's work was done before running it again."

[QAD5013]
severity = 30
text = "Command &1 not found."
cause = "The system found no command &1 in the library list of the signed-on profile's job, or in the library named with it."
recovery = "Check the command's name and library. Commands run with the library list of the signed-on profile's job description."

[QAD5020]
severity = 30
text = "Command &1 has errors; see the messages."
cause = "The system checked command &1 without running it and found errors. Its messages are listed as the system sent them."
recovery = "Correct the parameters the messages name, then check or run the command again. Select a message's ID for its second-level text."

[QAD5030]
severity = 10
text = "Automatic sign-on needs Telnet over TLS."
cause = "Automatic sign-on sends a one-time QAP ticket, and QS/400 accepts one only over a Telnet connection that uses TLS. This session does not use TLS, so it shows the system's sign-on display."
recovery = "To sign on automatically, select Use TLS in Session Properties; the system's Telnet server must have a certificate this computer trusts."

[QAD6001]
severity = 0
text = "&1 spooled files on &2."
cause = "The Printer Output list shows the spooled files on system &2 that match the filter: &1 in all, a page at a time. Clicking a column heading sorts the page shown, not the whole list."
recovery = "None needed. Change the filter and select Go to list other files. Select Refresh, or set Auto-refresh, to see files that arrived since."

[QAD6002]
severity = 0
text = "Spooled file &1 held."
cause = "Spooled file &1 was held on the system: it is not printed until it is released. A file being printed when it was held stops immediately or at the end of the current page, as chosen."
recovery = "To print it, select it and select Release."

[QAD6003]
severity = 0
text = "Spooled file &1 released."
cause = "Spooled file &1 was released: it prints when a writer for its output queue reaches it."
recovery = "None needed. If it does not print, check in Output Queues that a writer is attached to its queue and that the queue is not held."

[QAD6004]
severity = 0
text = "Spooled file &1 deleted."
cause = "Spooled file &1 was deleted from the system, with its data."
recovery = "None needed. A deleted spooled file cannot be brought back; run the job that made it again to make it again."

[QAD6005]
severity = 0
text = "Spooled file &1 moved to &2."
cause = "Spooled file &1 is now on output queue &2, at the end of the queue or at its top, as chosen. It prints when a writer for that queue reaches it."
recovery = "None needed."

[QAD6006]
severity = 30
text = "&1 of &2 actions failed; see the details."
cause = "An action was asked for on &2 spooled files, one request each, and the system refused &1 of them. The summary lists every file, and for each refusal the system's message as it sent it."
recovery = "Select a refusal's message ID for its second-level text, correct what it names, refresh the list, then try the action again on those files."

[QAD6010]
severity = 0
text = "Reading &1: page &2 of &3."
cause = "Spooled file &1 is being read from the system a batch of pages at a time: &2 of its &3 pages have arrived. The pages that have arrived can be looked at while the rest arrive."
recovery = "None needed. Select Cancel to stop reading; the pages read so far stay."

[QAD6011]
severity = 10
text = "Reading &1 cancelled."
cause = "Cancel was selected while spooled file &1 was being read. The system was asked to stop the batch it was reading, and what it sent for that batch was discarded. Pages read before it stay."
recovery = "Open or save the file again to read all of it."

[QAD6012]
severity = 20
text = "Spooled file &1 is still being written."
cause = "Spooled file &1 is still open: the program making it has not closed it, so its pages cannot be read yet. The system sent no message of its own for this."
recovery = "Wait for the job that makes the file to close it, select Refresh, and open the file again."

[QAD6013]
severity = 20
text = "Spooled file &1 cannot be shown as &2."
cause = "The system cannot make &2 of spooled file &1 from the kind of data the file holds, and sent no message of its own saying why."
recovery = "Look at the file from a 5250 display session (WRKSPLF, option 5), or print it on a printer device that takes its kind of data."

[QAD6014]
severity = 30
text = "Reply from &1 was larger than the program allows."
cause = "A reply from system &1 grew past 64 MiB, more than this program joins into one reply. It was discarded and the connection was closed; the session resumes on the next connection."
recovery = "Ask for less at a time. Spooled files are read a batch of pages at a time; if one batch is this large, keep the program's log and report the problem."

[QAD6020]
severity = 0
text = "&1 saved to &2."
cause = "Spooled file &1 was read from the system and written to &2."
recovery = "None needed."

[QAD6021]
severity = 0
text = "&1 sent to printer &2."
cause = "Spooled file &1 was read from the system and sent to printer &2 on this computer, laid out as a 5250 printer session prints it."
recovery = "None needed. If it does not print, check printer &2 on this computer."

[QAD7001]
severity = 0
text = "Connected to &1 for &2 (job &3)."
cause = "&2 has a connection of its own to system &1, attached to this program's session there without a new sign-on. Its job, &3, runs as the signed-on profile and keeps its own library list, QTEMP, commitment definition, statements and cursors."
recovery = "None needed. Closing the window closes the connection and ends job &3; it does not sign off, and the session goes on."

[QAD7002]
severity = 10
text = "&1 needs its own connection, and the server is older than version 4."
cause = "&1 runs in a connection of its own, attached to the session, so that it never waits behind or holds up anything else. The QAP server on the system speaks a version before 4, which cannot attach a connection to a session."
recovery = "Ask for the system to be upgraded to a QS/400 release whose QAP server speaks version 4 or later. Until then Run Command uses the session's shared connection, as before; Run SQL, Schemas and Data Transfer are not available."

[QAD7003]
severity = 30
text = "No more connections allowed to &1. Close a window and try again."
cause = "A session on system &1 may have at most 16 connections, the shared one included, and it has them all: the system refused another (TCP1A59). Each Run SQL and Run Command window and each Data Transfer run has one."
recovery = "Close a Run SQL, Run Command or Data Transfer window, or wait for a transfer to end, then try again."

[QAD7010]
severity = 30
text = "The connection to &1 was lost; the statement must be run again."
cause = "The window's connection to system &1 closed while a statement ran or before its result was read. Its job ended with it, and with the job its statements, cursors and uncommitted changes, which the system rolled back. The statement was not run again by this program."
recovery = "Check what the statement did, if it changes data, and run it again. The next run attaches a new connection; the rows already shown stay, marked incomplete."

[QAD7011]
severity = 10
text = "Result is incomplete: &1."
cause = "Not every row of the result was read: &1. The rows shown are those the system sent before that."
recovery = "Run the statement again for the whole result. The rows shown can still be copied or exported, marked incomplete."

[QAD7020]
severity = 0
text = "&1 rows changed."
cause = "The statement changed &1 rows. Under commitment control the changes are not committed until Commit."
recovery = "None needed. Under a commit level other than None, select Commit to keep the changes or Rollback to undo them."

[QAD7021]
severity = 10
text = "Uncommitted changes in &1. Commit, roll back, or cancel."
cause = "Statements in &1 changed data under commitment control, and the changes are neither committed nor rolled back. Closing the connection, or changing the commit level or naming, needs them settled first: a connection that closes rolls them back."
recovery = "Select Commit to keep the changes, Roll Back to undo them, or Cancel to go back to the window."

[QAD7030]
severity = 0
text = "Transfer &1 complete: &2 rows in &3."
cause = "Every row of transfer &1 was transferred: &2 rows, in &3."
recovery = "None needed."

[QAD7031]
severity = 30
text = "Transfer &1 failed at row &2 (line &3 of &4): &5."
cause = "The system refused row &2 of transfer &1, from line &3 of &4, with: &5. What was kept depends on the transfer's commitment options; the report says how many rows were committed."
recovery = "Correct the row in &4, or the column mapping, and run the transfer again; when rows were committed, resume from the row the report gives."

[QAD7032]
severity = 10
text = "Transfer &1 was cancelled; nothing was kept."
cause = "Transfer &1 was cancelled before it ended. A download's partial output file was deleted; an upload's uncommitted rows were rolled back."
recovery = "Run the transfer again when you are ready."

[QAD7033]
severity = 20
text = "&2 rows committed before the failure; resume from row &3."
cause = "Transfer &1 commits every few batches. &2 rows were committed before the failure and stay on the system; the batches after them were rolled back. Row &3 is the first row not committed."
recovery = "Correct the failing row, then select Resume from row &3. The resume row is saved with the request."

[QAD7034]
severity = 10
text = "&1 cannot use commitment control; uploading without it."
cause = "Table &1 cannot be changed under commitment control (for example, it is not journaled): the system answered SQL7008, SQLSTATE 55019. The upload goes on without commitment control, so a failure leaves every row before the failing one in the table."
recovery = "Journal table &1 if a failed upload must leave nothing behind, then upload with commitment control. Otherwise, resume from the failing row after a failure."

[QAD7035]
severity = 20
text = "Column &1: value &2 does not fit &3."
cause = "In the preview, value &2 for column &1 cannot be stored in its type &3: it is too long, has too many digits, or is not of that type. Only the first such value of each column is shown."
recovery = "Correct the value in the source file, or map the column to another target column, before running the transfer."

[QAD7036]
severity = 30
text = "Transfer &1 failed: &2."
cause = "Transfer &1 from the system did not finish, because: &2. No row is named, because rows read from the system are not refused one by one: the system refused the statement or stopped sending rows, or the file &3 could not be written. The rows already read were set aside, so &3 is as it was before the transfer: not made if it was not there, and not changed if it was."
recovery = "Correct what the reason names: the table, the columns or the WHERE clause of the transfer, your authority to the table, or the folder and name of &3. Then run the transfer again. It starts from the first row."

[QAD7040]
severity = 0
text = "Request saved to &1."
cause = "The transfer request was saved to &1. It holds everything needed to run the transfer again except passwords, which are never saved."
recovery = "None needed. Open &1, or run it with qsaccess run, to transfer again."

[QAD8001]
severity = 0
text = "&1 entries in &2."
cause = "The folder &2 on the system holds &1 entries that match the name pattern shown. The list shows them a page of 500 at a time; scrolling down loads the next page."
recovery = "None needed. To see fewer entries, enter a name pattern with * and ? and press Enter."

[QAD8002]
severity = 0
text = "Folder &1 created."
cause = "The folder &1 was created on the system, with the authorities its parent folder gives new objects."
recovery = "None needed."

[QAD8003]
severity = 0
text = "&1 renamed to &2."
cause = "The system renamed or moved &1 to &2."
recovery = "None needed. To undo it, rename &2 back."

[QAD8004]
severity = 0
text = "&1 deleted."
cause = "&1 was deleted on the system. A deleted file cannot be recovered from this program."
recovery = "None needed."

[QAD8005]
severity = 0
text = "&1 copied to &2."
cause = "The system copied &1 to &2, keeping its data and CCSID as stored. The data did not pass through this computer."
recovery = "None needed."

[QAD8006]
severity = 30
text = "Deleting &1 stopped at &2: &3."
cause = "The folder &1 is deleted from the inside out, one entry at a time. The system refused to delete &2, with the message shown (&3), so the delete stopped there. Entries deleted before it stay deleted; &2, the folders that hold it and anything not reached yet are still there."
recovery = "Correct what the system's message describes (for example, a file checked out to another user, or one you are not authorized to delete), then delete &1 again."

[QAD8010]
severity = 10
text = "&1 already exists in &2."
cause = "An entry named &1 is already in the folder &2, so the copy, move, upload or download would replace it."
recovery = "Choose Replace to replace it, Skip to leave it as it is, or Keep both (downloads only) to save the new file with a number added to its name."

[QAD8011]
severity = 10
text = "&1 changed on the system since you opened it."
cause = "The file &1 was changed on the system after this editor read it: its change count (on QAP version 6; before it, its last-changed time) is not the one it had when it was opened or last saved. Saving now would replace those changes."
recovery = "Choose Overwrite to save your text over the system's file, Reload to read the system's file again and lose your changes, or Cancel to go on editing."

[QAD8012]
severity = 20
text = "&1 is too large to edit here; download it instead."
cause = "The file &1 is larger than 64 MiB, the most the built-in editor opens."
recovery = "Download the file, then open it with a program on this computer that edits large files, and upload it again."

[QAD8013]
severity = 10
text = "&1 is not a text file; opened read-only."
cause = "The file &1 is binary (its CCSID is 65535, or its first 8 KiB hold NUL bytes), or it is larger than 8 MiB, so the editor shows it without letting it be changed."
recovery = "To change the file, download it, edit it with a program that suits it, and upload it again."

[QAD8020]
severity = 0
text = "Transfer of &1 complete: &2 in &3."
cause = "The file &1 was copied; &2 of data took &3."
recovery = "None needed."

[QAD8021]
severity = 20
text = "Transfer of &1 failed: &2."
cause = "The file &1 was not copied completely. The reason given was: &2. A download keeps its partial data in a temporary file beside the target; the target itself is unchanged."
recovery = "Correct the cause, then select Retry in the transfer list. A binary transfer, and a text download, resume from the last part the system confirmed; a text upload starts again from the beginning."

[QAD8022]
severity = 10
text = "Transfer of &1 cancelled."
cause = "The transfer of &1 was cancelled before it ended. A download keeps its partial data in a temporary file beside the target; the target itself is unchanged."
recovery = "Select Retry in the transfer list to go on from where it stopped, or Remove finished to drop it from the list."

[QAD8023]
severity = 0
text = "Resuming &1 at &2."
cause = "The transfer of &1 goes on from &2, the last part the system confirmed before it stopped, instead of starting again."
recovery = "None needed."

[QAD8030]
severity = 10
text = "No connection available for transfers; using the shared connection."
cause = "The session already has the 16 connections the system allows (TCP1A59), so this window could not get a connection of its own for its transfers. They run on the session's shared connection instead, one request at a time, and may be slower."
recovery = "None needed. To give transfers a connection of their own, close a Run SQL, Run Command or Integrated File System window, then close and open this window again."

[QAD8040]
severity = 30
text = "A connection to this program from another user was refused."
cause = "A program running as another user, or one whose user could not be checked, connected to this program's private link, which takes connections from the same user only. It was closed before anything was read from it."
recovery = "None needed if you expected nothing. If it happens again, find out which program runs as another user and connects to QS/400 Access for Desktop; the program's log names its user."

[QAD9001]
severity = 0
text = "&1 messages on &2."
cause = "The message queue &2 holds &1 messages. The list shows them newest first, 100 at a time; inquiries waiting for a reply are in bold."
recovery = "None needed. Select a message to see its second-level text, and reply to an inquiry from the detail pane."

[QAD9002]
severity = 0
text = "Reply sent to &1."
cause = "The reply was sent to the inquiry &1, and the system took it. The program that sent the inquiry receives it and goes on."
recovery = "None needed."

[QAD9003]
severity = 0
text = "&1 messages removed from &2."
cause = "The system removed &1 messages from the message queue &2. An inquiry removed before it was answered gets no reply: its sender waits until it ends some other way."
recovery = "None needed."

[QAD9004]
severity = 0
text = "Message sent to &1."
cause = "The system put the message on the message queue of &1. For an inquiry, the reply comes to your own message queue."
recovery = "None needed. For an inquiry, keep Send Message open to see the reply, or look for it in Messages."

[QAD9005]
severity = 0
text = "Reply received from &1: &2."
cause = "&1 answered your inquiry with &2. The reply is on your own message queue, and the copy of your inquiry there shows it too."
recovery = "None needed."

[QAD9010]
severity = 0
text = "Watching &1 on &2."
cause = "The system reports each message that arrives on &1 on system &2 to this program, on its shared connection, within about a quarter of a second. Watching only looks: a 5250 session that holds the queue in break mode keeps it."
recovery = "None needed. To change which queues are watched, and what opens Message Arrived, select Messages > Options."

[QAD9011]
severity = 20
text = "Watching &1 on &2 stopped: &3."
cause = "This program could not watch &1 on system &2 again after it reconnected or signed on. The reason given was: &3. Messages that arrive there are not reported until it can."
recovery = "Correct the cause, then sign off and sign on again, or reconnect: watching starts again, and the messages that arrived in between are caught up."

[QAD9012]
severity = 10
text = "Not authorized to &1 on &2; it will not be watched."
cause = "Your user profile on system &2 may not display the messages on &1, so this program does not watch it, and its option in Messages > Options is turned off."
recovery = "Ask your security officer for authority to the message queue if you need it, then turn the option on again in Messages > Options."

[QAD9013]
severity = 0
text = "Caught up &1 messages on &2 after reconnecting."
cause = "While this program was not connected, &1 messages arrived on &2. It watched the queue again and listed what it had missed, each message once."
recovery = "None needed."

[QAD9020]
severity = 0
text = "Printer Output is updating as changes happen."
cause = "The system reports each spooled file added, changed or removed for the list's user or output queue as it happens, so this window does not ask for the list again on a timer."
recovery = "None needed. Refresh still asks for the page shown at once."

[QAD9021]
severity = 0
text = "Printer Output is refreshing every &1 seconds."
cause = "This window asks for the page shown every &1 seconds: the system's QAP version reports no spool changes, the list shows every user's files on every queue (a watch needs one user or one queue), or watching failed."
recovery = "None needed. To have the list update as changes happen, choose one user or one output queue in the filter on a system whose QAP version is 6 or later. Auto-refresh sets how often it asks otherwise."
