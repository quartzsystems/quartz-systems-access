# Fuzz targets for tn5250, scs, pwsub and hostsvr-proto (cargo-fuzz;
# nightly). Not part of the main workspace. See README.md.
[package]
name = "tn5250-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
qsa-net = { path = "../qsa-net" }
pwsub = { path = "../pwsub", features = ["unverified-change"] }
hostsvr-proto = { path = "../hostsvr-proto" }
tn5250 = { path = "../tn5250" }
scs = { path = "../scs" }

[workspace]
members = ["."]

[[bin]]
name = "telnet_decoder"
path = "fuzz_targets/telnet_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_parser"
path = "fuzz_targets/stream_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser_input"
path = "fuzz_targets/parser_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scs_parser"
path = "fuzz_targets/scs_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pwsub_inputs"
path = "fuzz_targets/pwsub_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hostsvr_decode"
path = "fuzz_targets/hostsvr_decode.rs"
test = false
doc = false
bench = false
