[package]
name = "qsaccess"
description = "QS/400 Access for Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fltk.workspace = true
qsa-ui.workspace = true
qsa-config.workspace = true
directories.workspace = true
qsa-msg.workspace = true
qsa-net.workspace = true
qap-client.workspace = true
qsa-sql.workspace = true
qsa-transfer.workspace = true
tn5250.workspace = true
scs.workspace = true
qsa-print.workspace = true

[dev-dependencies]
qapd.workspace = true
qapd_v1.workspace = true
qap_proto_v1.workspace = true
qapd_v2.workspace = true
qap_proto_v2.workspace = true
rustls.workspace = true

[build-dependencies]
qsa-glyph.workspace = true
qsa-icons.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[test]]
name = "screenshots"
harness = false
