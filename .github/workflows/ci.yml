name: ci

on:
  # Branches only: a tag runs this through release.yml instead.
  push:
    branches: ["**"]
  pull_request:
  # release.yml runs every check before it publishes.
  workflow_call:
  workflow_dispatch:
    inputs:
      bless:
        description: "Write new screenshot goldens and upload them (QSA_BLESS=1)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  QSA_BLESS: ${{ inputs.bless && '1' || '' }}

jobs:
  windows:
    name: checks (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    # A test that hangs fails the job in an hour, not GitHub's six.
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Clean-room check
        run: ci/cleanroom.sh

      - name: Copyright headers
        run: ci/headers.sh

      - name: QAP spec mirror matches the pinned commit
        run: ci/spec-mirror.sh

      - name: Cargo.toml's version is VERSION's
        run: ci/version.sh check

      - name: Release names are VERSION's
        run: ci/version.sh names

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets --target $TARGET

      - name: Network, protocol and print crates have no UI dependencies
        run: ci/deps.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target $TARGET -- -D warnings

      # Unit tests, the replay fixtures, the console pixel test and the
      # screenshot tests.
      - name: Test
        run: cargo test --workspace --target $TARGET

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-Windows
          path: target/screenshots/
          if-no-files-found: warn

      - name: Upload blessed goldens
        if: inputs.bless
        uses: actions/upload-artifact@v4
        with:
          name: goldens-windows
          path: |
            qsaccess/tests/goldens/windows/
            qsa-install/tests/goldens/windows/

  linux:
    name: checks (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    # A test that hangs fails the job in an hour, not GitHub's six.
    timeout-minutes: 60
    # The image is pinned by digest, so the libraries that draw the
    # screenshots (FreeType, Xft, Cairo, Pango) only change when this does.
    container:
      image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    env:
      TARGET: x86_64-unknown-linux-gnu
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential \
            cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            xvfb xauth weston \
            poppler-utils=24.02.0-1ubuntu9.11
          # Only the fonts the application bundles may be used.
          rm -rf /usr/share/fonts/* /usr/local/share/fonts/*
          fc-cache -f

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Clean-room check
        run: ci/cleanroom.sh

      - name: Copyright headers
        run: ci/headers.sh

      - name: QAP spec mirror matches the pinned commit
        run: ci/spec-mirror.sh

      - name: Cargo.toml's version is VERSION's
        run: ci/version.sh check

      - name: Release names are VERSION's
        run: ci/version.sh names

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets --target $TARGET

      - name: Network, protocol and print crates have no UI dependencies
        run: ci/deps.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target $TARGET -- -D warnings

      # Unit tests, the replay fixtures, the console pixel test and the
      # screenshot tests (X11, under Xvfb).
      # The PDF goldens' page images need the pinned pdftoppm installed
      # above.
      - name: Test (X11 under Xvfb)
        env:
          FLTK_BACKEND: x11
          QSA_REQUIRE_PDFTOPPM: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -dpi 96" cargo test --workspace --target $TARGET

      # The screenshots again under Wayland, against the Wayland goldens.
      # Weston runs on its X11 backend inside Xvfb: its seat then has a
      # pointer, which FLTK's Wayland driver requires (it crashes on the
      # pointer-less seat of Weston's headless backend).
      - name: Screenshots (Wayland under Weston)
        run: ci/wayland-screenshots.sh --target $TARGET

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-Linux
          path: target/screenshots/
          if-no-files-found: warn

      - name: Upload blessed goldens
        if: inputs.bless
        uses: actions/upload-artifact@v4
        with:
          name: goldens-linux
          path: |
            qsaccess/tests/goldens/linux/
            qsaccess/tests/goldens/linux-wayland/
            qsa-install/tests/goldens/linux/
            qsa-install/tests/goldens/linux-wayland/
            qsa-print/tests/goldens/

  # The installer, end to end and silently: install, upgrade, repair and
  # uninstall, then nothing left behind. See TESTING.md.
  installer-windows:
    name: installer (Windows, just me and all users)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-windows
      - name: Installer file name, from VERSION
        id: name
        shell: bash
        run: echo "installer=target/dist/QS400-Access-$(ci/version.sh release)-windows-x86_64.exe" >> "$GITHUB_OUTPUT"
      - name: Build the installer
        run: cargo xtask dist
      - name: Just me
        run: ci/installer-test-windows.ps1 -Installer ${{ steps.name.outputs.installer }} -Scope user
      # The runner's account is an administrator, so there is no consent
      # prompt.
      - name: All users
        run: ci/installer-test-windows.ps1 -Installer ${{ steps.name.outputs.installer }} -Scope machine
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: ${{ steps.name.outputs.installer }}
          if-no-files-found: error

  installer-linux:
    name: installer (Linux, glibc 2.31 build; Ubuntu 24.04 and AlmaLinux 9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Installer file name, from VERSION
        id: name
        run: echo "installer=target/dist/QS400-Access-$(ci/version.sh release)-linux-x86_64" >> "$GITHUB_OUTPUT"
      - name: Build the installer in the glibc 2.31 image
        run: ci/dist-linux.sh
      - name: Root and user, in fresh containers
        run: ci/installer-test-linux-containers.sh ${{ steps.name.outputs.installer }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: ${{ steps.name.outputs.installer }}
          if-no-files-found: error

  screenshot-report:
    name: screenshot report (Windows vs Linux)
    needs: [windows, linux]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shots
      - name: Build report
        run: |
          python3 ci/screenshot_report.py report             windows=shots/screenshots-Windows/windows             linux-x11=shots/screenshots-Linux/linux             linux-wayland=shots/screenshots-Linux/linux-wayland
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: report/
