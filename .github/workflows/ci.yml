name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdbus-1-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            xvfb xauth

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clean-room check
        run: ci/cleanroom.sh

      - name: Copyright headers
        run: ci/headers.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      - name: tn5250 has no UI dependencies
        run: ci/deps.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24 -dpi 96" cargo test --workspace --target ${{ matrix.target }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --target ${{ matrix.target }}
